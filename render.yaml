services:
  - type: web
    name: royalhints
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: 3306
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_SSL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYCHANGU_SECRET_KEY
        sync: false
      - key: PAYCHANGU_PUBLIC_KEY
        sync: false
      - key: PAYCHANGU_WEBHOOK_SECRET
        sync: false
      - key: PAYCHANGU_API_BASE_URL
        value: https://api.paychangu.com
      - key: PAYCHANGU_CURRENCY
        value: MWK
      - key: PUBLIC_BASE_URL
        value: https://royalhints.com
      - key: PAYCHANGU_CALLBACK_URL
        value: https://royalhints.com/api/payments/paychangu/callback
      - key: PAYCHANGU_RETURN_URL
        value: https://royalhints.com/checkout?payment=return
